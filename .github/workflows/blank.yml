name: Build Monitor-Mode Kernel (Mi 10 Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your own repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex device-tree-compiler git make python3 kmod cpio rsync zip
          sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download Clang 21.0.0
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth 1 clang-toolchain
          echo "$PWD/clang-toolchain/clang-r487747/bin" >> $GITHUB_PATH

      - name: Apply custom patches (if you add any)
        run: |
          if [ -d "patches" ]; then
            for patch in patches/*.patch; do
              echo "Applying $patch"
              patch -p1 < $patch
            done
          else
            echo "No patches folder found. Skipping."
          fi

      - name: Configure kernel for full monitor mode
        run: |
          # Use your stock config
          cp stock_config.txt .config

          # Enable all common external USB WiFi adapters + monitor mode
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          scripts/config --enable CONFIG_MAC80211_DEBUGFS
          scripts/config --enable CONFIG_MAC80211_MESH
          
          # Popular USB WiFi chips
          scripts/config --enable CONFIG_ATH9K
          scripts/config --enable CONFIG_ATH9K_HW
          scripts/config --enable CONFIG_USB_ATH9K
          scripts/config --enable CONFIG_RTL88X2BU
          scripts/config --enable CONFIG_RTL8812AU
          scripts/config --enable CONFIG_RTL8821CU
          scripts/config --enable CONFIG_RTL8188EU
          scripts/config --enable CONFIG_MT7610U
          scripts/config --enable CONFIG_MT7612U

          # Finalize config
          make olddefconfig

      - name: Compile Kernel, dtb, dtbo & modules
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 -j$(nproc) \
            Image dtbo.img dtb modules

      - name: Package as AnyKernel3 ZIP
        run: |
          mkdir -p AnyKernel3/META-INF/com/google/android
          mkdir -p AnyKernel3/modules

          # Copy required binaries
          cp arch/arm64/boot/Image AnyKernel3/
          cp arch/arm64/boot/dtb AnyKernel3/
          cp arch/arm64/boot/dtbo.img AnyKernel3/
          find . -name '*.ko' -exec cp {} AnyKernel3/modules/ \;

          # Generate minimal AnyKernel3 script
          cat > AnyKernel3/anykernel.sh << 'EOF'
          #!/sbin/sh
          export KERNEL=Image
          export DTBO=dtbo.img
          export DTB=dtb
          export MODULESDIR=modules
          dump_boot;
          write_boot;
          EOF
          chmod +x AnyKernel3/anykernel.sh

          # Create the flashable zip
          cd AnyKernel3
          zip -r9 ../Mi10Ultra_MonitorMode_AnyKernel3.zip *

      - name: Upload the final kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Mi10Ultra_MonitorMode_Kernel
          path: Mi10Ultra_MonitorMode_AnyKernel3.zip
