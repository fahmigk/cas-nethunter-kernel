name: Build Mi10Ultra Kernel with RTL8188EUS

on:
  workflow_dispatch:

env:
  KERNEL_VERSION: "4.19.325-cip131-st15-aptusitu-perf-gafc406285284"
  KERNEL_COMMIT: "afc406285284"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 bison flex libssl-dev libelf-dev bc zip unzip curl wget cpio rsync build-essential gcc-aarch64-linux-gnu clang lld device-tree-compiler

      - name: Extract boot.zip
        run: |
          unzip -q boot.zip -d boot_extracted
          ls -lh boot_extracted/

      - name: Clone Kernel Source
        run: |
          git clone -b android16-aptusitu https://github.com/ApartTUSITU/kernel_xiaomi_sm8250_mod.git kernel
          cd kernel
          if git rev-parse --verify --quiet ${KERNEL_COMMIT}^{commit}; then
            git checkout ${KERNEL_COMMIT}
          fi

      - name: Patch Kernel Source for Clang
        run: |
          cd kernel
          sed -i 's/static inline __printf(1, 0) int bpf_do_trace_printk/static __printf(1, 0) int bpf_do_trace_printk/' kernel/trace/bpf_trace.c
          echo "Patched bpf_trace.c successfully"

      - name: Configure Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out cas_defconfig
          echo "CONFIG_RTL8188EUS=y" >> out/.config
          echo "CONFIG_USB=y" >> out/.config          echo "CONFIG_USB_SUPPORT=y" >> out/.config
          echo "CONFIG_CFG80211=y" >> out/.config
          echo "CONFIG_MAC80211=y" >> out/.config
          echo "CONFIG_WIRELESS_EXT=y" >> out/.config
          echo "CONFIG_NETDEVICES=y" >> out/.config
          echo "CONFIG_WLAN=y" >> out/.config
          make O=out olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LOCALVERSION="-aptusitu-perf"
          make -j$(nproc) O=out KCFLAGS="-Wno-error -Wno-format"
          ls -lh out/arch/arm64/boot/

      - name: Extract MagiskBoot
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.apk
          unzip -q magisk.apk -d magisk_extracted
          cp magisk_extracted/lib/x86_64/libmagiskboot.so magiskboot-linux
          chmod +x magiskboot-linux

      - name: Repack boot.img
        run: |
          mkdir -p out/boot
          cp boot_extracted/boot.img out/boot/original-boot.img
          cd out/boot
          ../../magiskboot-linux unpack original-boot.img
          if [ -f ../../kernel/out/arch/arm64/boot/Image.gz ]; then
            KERNEL_IMG=../../kernel/out/arch/arm64/boot/Image.gz
          elif [ -f ../../kernel/out/arch/arm64/boot/Image ]; then
            KERNEL_IMG=../../kernel/out/arch/arm64/boot/Image
          else
            exit 1
          fi
          if [ -f kernel ]; then
            cp $KERNEL_IMG kernel
          else
            exit 1
          fi
          ../../magiskboot-linux repack original-boot.img new-boot.img
          ls -lh new-boot.img

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:          name: NetHunter-Boot-Image
          path: out/boot/new-boot.img
