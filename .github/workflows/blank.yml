      - name: Package Flasheable ZIP (AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          
          # Fix AnyKernel installer parameters for Xiaomi devices
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/by-name/boot;|g' anykernel.sh
          
          # Copy the newly built custom kernel
          cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb ./
          
          # Create the driver folder
          mkdir -p TP-Link-Driver
          
          # Copy your custom adapter driver
          cp ../rtl8188eus/8188eu.ko TP-Link-Driver/
          
          # FIX: Rescue the Android Wi-Fi Core modules from the build server!
          find ../kernel-source/out -type f -name "cfg80211.ko" -exec cp {} TP-Link-Driver/ \;
          find ../kernel-source/out -type f -name "mac80211.ko" -exec cp {} TP-Link-Driver/ \;
          
          # Create the final TWRP-flashable zip
          zip -r9 ../NetHunter-Kernel-Mi10Ultra.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Mi10Ultra
          path: NetHunter-Kernel-Mi10Ultra.zip
