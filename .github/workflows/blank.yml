name: Build Custom NetHunter & ReSukiSU Kernel (cas)

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-kernel:
    name: Compile Base Kernel
    runs-on: ubuntu-22.04
    steps:
      # Step 1: Target Waddah's exact Android 16 unified kernel repository branch
      - name: Checkout Target Kernel Source
        uses: actions/checkout@v4
        with:
          repository: wshamroukh/android_kernel_xiaomi_sm8250
          ref: android16-aptusitu
          path: kernel/source

      # Step 2: Remove Duplicate Driver & Strip Warnings
      - name: Patch Makefiles & Pre-Configure Environment
        run: |
          cd kernel/source
          
          # Disable Warnings-as-Errors globally to prevent driver warning crashes
          find . -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          find . -name "Kbuild" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          echo 'KBUILD_CFLAGS += -Wno-unknown-warning-option' >> Makefile

          # Fix duplicate touchscreen definition that crashes the linking phase
          sed -i '/fts_521/d' drivers/input/touchscreen/Makefile
          
          # Inject full architectural NetHunter Wireless/HID requirements into the defconfig
          cat <<EOF >> arch/arm64/configs/cas_defconfig
          
          # Foundational NetHunter Core Network Architecture
          CONFIG_STAGING=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_MAC80211=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211_LEDS=y
          CONFIG_RFKILL=y
          CONFIG_WIRELESS=y
          CONFIG_NL80211_TESTMODE=y
          CONFIG_MAC80211_MESH=y

          # Native Built-in Realtek 8188EU Support
          CONFIG_R8188EU=y
          CONFIG_8188EU_AP_MODE=y

          # HID Gadget & Keyboard Injection Emulation
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_G_HID=y
          EOF

      # Step 3: Run the build action using its native automatic KernelSU setup manager
      - name: Run Build Execution Engine
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: kernel/source/
          config: cas_defconfig
          arch: arm64
          android-version: 12

          # Natively manage KernelSU integration to avoid manual symlink/path syntax errors
          ksu: true
          ksu-version: main
          
          nethunter: true
          nethunter-patch: false 

          # Use AOSP Clang toolchain along with full LLVM variable management
          aosp-clang: true
          aosp-clang-version: r383902
          aosp-gcc: true
          disable-lto: true

          # Package into a flashable AnyKernel3 zip and automatically create a GitHub Release
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
