name: Build Mi10Ultra NetHunter Kernel (Clang + Patches)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 bison flex libssl-dev libelf-dev bc zip unzip curl wget cpio rsync build-essential gcc-aarch64-linux-gnu clang lld device-tree-compiler

      - name: Clone Kernel Source
        run: |
          git clone -b android16-aptusitu https://github.com/ApartTUSITU/kernel_xiaomi_sm8250_mod.git kernel

      - name: Patch Kernel Source (Fix Clang Errors)
        run: |
          cd kernel
          
          # Fix 1: Remove 'inline' from bpf_trace.c to fix varargs error
          echo "Patching bpf_trace.c..."
          sed -i 's/static inline __printf(1, 0) int bpf_do_trace_printk/static __printf(1, 0) int bpf_do_trace_printk/' kernel/trace/bpf_trace.c
          
          # Fix 2: Change -Werror to -Wno-error in all Makefiles
          # This prevents walt.h format warnings from stopping the build
          echo "Disabling -Werror..."
          find . -type f -name "Makefile*" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          
          echo "Patches applied successfully!"

      - name: Configure Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make O=out cas_defconfig
          
          # Enable NetHunter / WiFi Drivers
          echo "CONFIG_RTL8188EUS=m" >> out/.config
          echo "CONFIG_RTL8812AU=m" >> out/.config
          echo "CONFIG_CFG80211=y" >> out/.config
          echo "CONFIG_MAC80211=y" >> out/.config
          echo "CONFIG_WIRELESS_EXT=y" >> out/.config
          
          make O=out olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Build Image.gz
          make -j$(nproc) O=out Image.gz
          
          echo "Build finished!"
          ls -lh out/arch/arm64/boot/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mi10Ultra-Kernel-Image
          path: kernel/out/arch/arm64/boot/Image.gz
