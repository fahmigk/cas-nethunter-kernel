name: Build Monitor-Mode Kernel (Mi 10 Ultra)

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE_URL: 'https://github.com/wshamroukh/android_kernel_xiaomi_sm8250'
  KERNEL_BRANCH: 'android16-aptusitu'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /opt/az /usr/local/azure /usr/local/share/boost /usr/local/share/chromium
          sudo docker system prune -af || true
          df -h

      - name: Checkout your config repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex device-tree-compiler git make python3 kmod cpio rsync zip
          sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install Clang 21 and LLD 21 from official LLVM repository
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main"
          sudo apt update
          sudo apt install -y clang-21 lld-21
          echo "CC=clang-21" >> $GITHUB_ENV
          echo "LD=ld.lld-21" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Clone the actual kernel source
        run: |
          git clone ${{ env.KERNEL_SOURCE_URL }} --depth 1 --branch ${{ env.KERNEL_BRANCH }} kernel_source

      - name: Configure kernel and apply hotfixes
        run: |
          cp stock_config.txt kernel_source/.config
          cd kernel_source

          # Enable WiFi and monitor mode
          sed -i 's/^# CONFIG_CFG80211 is not set/CONFIG_CFG80211=y/' .config
          sed -i 's/^CONFIG_CFG80211=m/CONFIG_CFG80211=y/' .config
          sed -i 's/^# CONFIG_MAC80211 is not set/CONFIG_MAC80211=y/' .config
          sed -i 's/^CONFIG_MAC80211=m/CONFIG_MAC80211=y/' .config
          sed -i 's/^# CONFIG_MAC80211_DEBUGFS is not set/CONFIG_MAC80211_DEBUGFS=y/' .config
          sed -i 's/^# CONFIG_MAC80211_MESH is not set/CONFIG_MAC80211_MESH=y/' .config
          sed -i 's/^# CONFIG_ATH9K is not set/CONFIG_ATH9K=y/' .config
          sed -i 's/^CONFIG_ATH9K=m/CONFIG_ATH9K=y/' .config
          sed -i 's/^# CONFIG_ATH9K_HW is not set/CONFIG_ATH9K_HW=y/' .config
          sed -i 's/^CONFIG_ATH9K_HW=m/CONFIG_ATH9K_HW=y/' .config
          sed -i 's/^# CONFIG_USB_ATH9K is not set/CONFIG_USB_ATH9K=y/' .config
          sed -i 's/^# CONFIG_RTL88X2BU is not set/CONFIG_RTL88X2BU=y/' .config
          sed -i 's/^# CONFIG_RTL8812AU is not set/CONFIG_RTL8812AU=y/' .config
          sed -i 's/^# CONFIG_RTL8821CU is not set/CONFIG_RTL8821CU=y/' .config
          sed -i 's/^# CONFIG_RTL8188EU is not set/CONFIG_RTL8188EU=y/' .config
          sed -i 's/^# CONFIG_MT7610U is not set/CONFIG_MT7610U=y/' .config
          sed -i 's/^# CONFIG_MT7612U is not set/CONFIG_MT7612U=y/' .config

          # Disable KernelSU
          sed -i 's/^CONFIG_KSU=y/CONFIG_KSU=n/' .config
          sed -i 's/^# CONFIG_KSU is not set/CONFIG_KSU=n/' .config
          sed -i '/^CONFIG_KSU_/d' .config
          echo '# CONFIG_KSU is not set' >> .config
          sed -i 's|source "drivers/kernelsu/Kconfig"|# source "drivers/kernelsu/Kconfig"|' drivers/Kconfig

          # Disable problematic vendor drivers (camera, display, clk debug)
          sed -i 's/^CONFIG_TECHPACK_CAMERA_XIAOMI_CAS=y/CONFIG_TECHPACK_CAMERA_XIAOMI_CAS=n/' .config
          sed -i 's/^CONFIG_TECHPACK_DISPLAY_HWC_OSS=y/CONFIG_TECHPACK_DISPLAY_HWC_OSS=n/' .config
          sed -i 's/^CONFIG_TECHPACK_DISPLAY=y/CONFIG_TECHPACK_DISPLAY=n/' .config 2>/dev/null || true
          sed -i 's/^CONFIG_MSM_CLK_DEBUG=y/CONFIG_MSM_CLK_DEBUG=n/' .config 2>/dev/null || true
          sed -i 's/^CONFIG_QCOM_CLK_DEBUG=y/CONFIG_QCOM_CLK_DEBUG=n/' .config 2>/dev/null || true
          sed -i 's/^CONFIG_CLK_DEBUG=y/CONFIG_CLK_DEBUG=n/' .config 2>/dev/null || true

          # Fix missing cam_req_mgr_interface.h include in cam_trace.h
          if [ -f techpack/camera/drivers/cam_utils/cam_trace.h ]; then
            sed -i 's|#include "cam_req_mgr_interface.h"|#include "../cam_req_mgr/cam_req_mgr_interface.h"|' techpack/camera/drivers/cam_utils/cam_trace.h
          fi

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          yes "" | make oldconfig

      - name: Compile Kernel, dtbo, and modules
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang-21
          export LD=ld.lld-21
          export LLVM=1

          make Image dtbo.img modules -j$(nproc) || \
          make Image dtbo.img dtbs modules -j$(nproc)

      - name: Package as AnyKernel3 ZIP
        run: |
          mkdir -p AnyKernel3/META-INF/com/google/android
          mkdir -p AnyKernel3/modules

          if [ -f kernel_source/arch/arm64/boot/Image ]; then
            cp kernel_source/arch/arm64/boot/Image AnyKernel3/
          fi
          if [ -f kernel_source/arch/arm64/boot/dtbo.img ]; then
            cp kernel_source/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          find kernel_source/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel3/dtb \; -quit || true
          find kernel_source -name '*.ko' -exec cp {} AnyKernel3/modules/ \;

          cat > AnyKernel3/anykernel.sh << 'EOF'
          #!/sbin/sh
          export KERNEL=Image
          export DTBO=dtbo.img
          export DTB=dtb
          export MODULESDIR=modules
          dump_boot;
          write_boot;
          EOF
          chmod +x AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../Mi10Ultra_MonitorMode_AnyKernel3.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mi10Ultra_MonitorMode_Kernel
          path: Mi10Ultra_MonitorMode_AnyKernel3.zip
