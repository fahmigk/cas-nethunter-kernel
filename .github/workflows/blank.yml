name: Build NetHunter Kernel (ReSukiSU - cas)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl \
            bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

      - name: Download Clang Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel Source (aptusitu branch)
        run: |
          git clone --depth=1 -b android16-aptusitu https://github.com/Searchur/Xiaomi_Redmi_SM8250_SukiSU_nonGKI_kernel.git kernel-source

      - name: Inject Official ReSukiSU Source & Bypass Checks
        run: |
          cd kernel-source
          
          # Delete the outdated root engine
          rm -rf KernelSU
          rm -rf drivers/kernelsu
          
          # Forcefully download the official ReSukiSU engine
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          
          # ---> THE FIX 1: NEUTER THE STRICT INLINE HOOK CHECK <---
          echo "" > KernelSU/kernel/tools/inline_hook_check.mk || true
          echo "" > drivers/kernelsu/kernel/tools/inline_hook_check.mk || true

          # ---> THE FIX 2: POLYFILL MISSING SUSFS COMMANDS <---
          # We downgrade the new SuSFS command to match your kernel's older naming convention natively.
          sed -i 's/CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS/CMD_SUSFS_HIDE_SUS_MNTS_FOR_ALL_PROCS/g' drivers/kernelsu/supercall/dispatch.c || true
          sed -i 's/susfs_hide_sus_mnts_for_non_su_procs/susfs_hide_sus_mnts_for_all_procs/g' drivers/kernelsu/supercall/dispatch.c || true
          
          # We inject a dummy fallback definition directly into the C file just in case the older command is completely absent.
          sed -i '1i #ifndef CMD_SUSFS_HIDE_SUS_MNTS_FOR_ALL_PROCS\n#define CMD_SUSFS_HIDE_SUS_MNTS_FOR_ALL_PROCS 0x55555555\n#define susfs_hide_sus_mnts_for_all_procs() 0\n#endif\n' drivers/kernelsu/supercall/dispatch.c || true

      - name: Inject NetHunter & Root Drivers into Stock Config
        run: |
          cd kernel-source
          mkdir -p out
          
          # Pull your proven working configuration from the repository
          cp ../stock_config out/.config

          # --- FIX FOR CGROUP COMPILATION BUG ---
          sed -i 's/CONFIG_CGROUP_NET_PRIO=y/# CONFIG_CGROUP_NET_PRIO is not set/g' out/.config
          sed -i 's/CONFIG_CGROUP_NET_CLASSID=y/# CONFIG_CGROUP_NET_CLASSID is not set/g' out/.config
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' include/net/netprio_cgroup.h || true
          
          # --- FORCE NON-GKI MANUAL HOOK ---
          sed -i 's/CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/g' out/.config
          sed -i 's/CONFIG_HAVE_KPROBES=y/# CONFIG_HAVE_KPROBES is not set/g' out/.config
          sed -i 's/CONFIG_KPROBE_EVENTS=y/# CONFIG_KPROBE_EVENTS is not set/g' out/.config
          sed -i 's/CONFIG_KPROBES_QGKI=y/# CONFIG_KPROBES_QGKI is not set/g' out/.config
          
          echo "Injecting Root and NetHunter configurations into your proven stock config..."

          cat << 'EOF' >> out/.config
          # --- ReSukiSU Official Non-GKI Hook ---
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # --- NetHunter Core ---
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_MAC80211_INJECTION=y
          
          # --- NetHunter USB / HID ---
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_HID_APPLE=y
          CONFIG_HID_MAGICMOUSE=y
          CONFIG_HID_MICROSOFT=y
          CONFIG_HID_MULTITOUCH=y
          
          # --- NetHunter Wi-Fi Drivers ---
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH_COMMON=m
          CONFIG_ATH_CARDS=m
          CONFIG_ATH9K=m
          CONFIG_ATH9K_HTC=m
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=m
          CONFIG_RT2800USB=m
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT7601U=m
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL818X=m
          CONFIG_RTL8187=m
          CONFIG_RTL8188EU=m
          CONFIG_RTL8192CU=m
          CONFIG_RTL8XXXU=m
          EOF

      - name: Compile the Kernel
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"

          # Safely apply the injected NetHunter config over your stock base
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          # Execute build
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git
          
          sed -i 's/kernel.string=.*/kernel.string=NetHunter-ReSukiSU-cas/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=cas/g' anykernel.sh
          
          sed -i 's|block=[^;]*;|BLOCK=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh
          sed -i 's|BLOCK=[^;]*;|BLOCK=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh
          
          sed -i 's/is_slot_device=[^;]*;/IS_SLOT_DEVICE=0;/g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=[^;]*;/IS_SLOT_DEVICE=0;/g' anykernel.sh

          cp ../kernel-source/out/arch/arm64/boot/Image* . || true
          cp ../kernel-source/out/arch/arm64/boot/dtb* . || true

          zip -r9 ../NetHunter-Kernel-cas.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-ReSukiSU-cas
          path: NetHunter-Kernel-cas.zip
