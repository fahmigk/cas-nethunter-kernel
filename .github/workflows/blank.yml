name: Build NetHunter Kernel (ReSukiSU - cas)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl \
            bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

      - name: Download Clang Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone EXACT Working Kernel Source (Searchur)
        run: |
          git clone --depth=1 --recurse-submodules -b android16-aptusitu https://github.com/Searchur/Xiaomi_Redmi_SM8250_SukiSU_nonGKI_kernel.git kernel-source

      - name: Bypass Strict Inline Hook Formatting Check
        run: |
          cd kernel-source
          echo "" > KernelSU/kernel/tools/inline_hook_check.mk || true
          echo "" > drivers/kernelsu/kernel/tools/inline_hook_check.mk || true

      - name: Configure Kernel & Inject NetHunter Modules
        run: |
          cd kernel-source
          mkdir -p out
          
          cp ../stock_config out/.config

          # --- FIX FOR CGROUP COMPILATION BUG ---
          sed -i 's/CONFIG_CGROUP_NET_PRIO=y/# CONFIG_CGROUP_NET_PRIO is not set/g' out/.config
          sed -i 's/CONFIG_CGROUP_NET_CLASSID=y/# CONFIG_CGROUP_NET_CLASSID is not set/g' out/.config
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' include/net/netprio_cgroup.h || true
          
          # --- GUARANTEE INLINE HOOKS ---
          sed -i 's/CONFIG_KSU_MANUAL_HOOK=y/# CONFIG_KSU_MANUAL_HOOK is not set/g' out/.config
          
          echo "Injecting NetHunter driver configurations..."

          cat << 'EOF' >> out/.config
          # --- GUARANTEE NATIVE SukiSU INLINE HOOKS (KPM) ---
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y

          # --- NetHunter Core Network & USB Configs ---
          CONFIG_USB=y
          CONFIG_USB_SUPPORT=y
          CONFIG_NETDEVICES=y
          CONFIG_WIRELESS_EXT=y
          # Core subsystems set to 'y' so the native Snapdragon driver links flawlessly
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_MAC80211_INJECTION=y
          CONFIG_BT=y
          
          # Keep the actual NetHunter hardware drivers as modules
          CONFIG_ATH9K_HTC=m
          CONFIG_MT76_USB=m
          CONFIG_BT_HCIBTUSB=m
          EOF

      - name: Compile the Core Kernel
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"

          yes "" | make O=out ARCH=arm64 CC=clang olddefconfig
          
          yes "" | make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 Image.gz-dtb

      - name: Compile External RTL8812AU Driver Module
        run: |
          # CRITICAL FIX: Use the official, actively maintained aircrack-ng repository
          git clone -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au.git rtl8812au
          cd rtl8812au
          
          export PATH="$(pwd)/../clang/bin:$PATH"
          
          make -C ../kernel-source/out M=$(pwd) ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- modules

      - name: Patch boot.img directly & Package Artifacts
        run: |
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -q Magisk-v27.0.apk lib/x86_64/libmagiskboot.so
          mv lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

          unzip -q boot.zip
          ./magiskboot unpack boot.img

          cp kernel-source/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot.img nethunter-boot.img

          mkdir -p final-package
          mv nethunter-boot.img final-package/
          mv rtl8812au/*.ko final-package/ || true

      - name: Upload Final Package
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-ReSukiSU-Package
          path: final-package/*
