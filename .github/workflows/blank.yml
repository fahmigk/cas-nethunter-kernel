name: Build Mi10 Ultra NetHunter & ReSukiSU Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl \
            bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

      - name: Download Clang Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone the Kernel Source
        run: |
          git clone --depth=1 --recurse-submodules -b android16-aptusitu https://github.com/Searchur/Xiaomi_Redmi_SM8250_SukiSU_nonGKI_kernel.git kernel-source

      - name: Configure and Embed Firmware
        run: |
          cd kernel-source
          mkdir -p out
          
          cp ../stock_config out/.config
          
          touch .scmversion
          sed -i 's/echo "\$res\$git_version"/echo "\$res"/g' scripts/setlocalversion || true
          
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' include/net/netprio_cgroup.h || true
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' net/core/netprio_cgroup.c || true
          
          find . -type f -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          find . -type f -name "Kbuild" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          
          ./scripts/config --file out/.config -e CONFIG_MODULES -e CONFIG_WIRELESS -e CONFIG_WIRELESS_EXT -e CONFIG_CFG80211 -e CONFIG_MAC80211
          ./scripts/config --file out/.config -e CONFIG_OVERLAY_FS -e CONFIG_DEBUG_FS -e CONFIG_SECURITY
          ./scripts/config --file out/.config -e CONFIG_KPROBES -e CONFIG_HAVE_KPROBES -e CONFIG_KPROBE_EVENTS -e CONFIG_KPM -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL -e CONFIG_KSU
          ./scripts/config --file out/.config -e CONFIG_KSU_SUSFS -e CONFIG_KSU_SUSFS_SUS_PATH -e CONFIG_KSU_SUSFS_SUS_MOUNT -e CONFIG_KSU_SUSFS_SUS_KSTAT

          # --- MEMORY BAKE FIRMWARE FIX ---
          # Download the required RTL8188EUS firmware
          mkdir -p firmware/rtlwifi
          curl -sL https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/rtl8188eufw.bin -o firmware/rtlwifi/rtl8188eufw.bin
          
          # Force the kernel to embed the firmware binary directly into the vmlinux image
          ./scripts/config --file out/.config --set-str CONFIG_EXTRA_FIRMWARE "rtlwifi/rtl8188eufw.bin"
          ./scripts/config --file out/.config --set-str CONFIG_EXTRA_FIRMWARE_DIR "firmware"

      - name: Compile the Full Kernel
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          export LOCALVERSION="-aptusitu-perf"
          
          MAKE_ARGS="O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip WERROR=0 KCFLAGS=-Wno-unknown-warning-option KSU=true KSU_SUSFS=true LOCALVERSION=${LOCALVERSION}"
          
          yes "" | make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb modules
          make $MAKE_ARGS modules_install INSTALL_MOD_PATH=modules_install INSTALL_MOD_STRIP=0

      - name: Compile External NetHunter Driver (RTL8188EUS)
        run: |
          git clone -b v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eus
          cd rtl8188eus
          export PATH="$(pwd)/../clang/bin:$PATH"
          
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_AARCH64 = n/CONFIG_PLATFORM_ARM_AARCH64 = y/g' Makefile
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KSRC=$(pwd)/../kernel-source/out \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211=1 -Wno-error -Wno-undef" \
            modules

      - name: Compile External NetHunter Driver (RTL8812AU)
        run: |
          git clone -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au.git rtl8812au
          cd rtl8812au
          export PATH="$(pwd)/../clang/bin:$PATH"
          
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_AARCH64 = n/CONFIG_PLATFORM_ARM_AARCH64 = y/g' Makefile
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KSRC=$(pwd)/../kernel-source/out \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211=1 -Wno-error -Wno-undef" \
            modules

      - name: Package Universal AOSP Flasheable ZIP (AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          
          cat << 'EOF' > anykernel.sh
          properties() { '
          kernel.string=Mi 10 Ultra NetHunter + ReSukiSU Kernel
          do.devicecheck=0
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cas
          '; }
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          . tools/ak3-core.sh;
          
          dump_boot;
          write_boot;
          EOF
          
          cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb ./
          mkdir -p modules/vendor/lib/modules/
          
          find ../kernel-source/out/modules_install/ -type f -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \; || true
          
          cp ../rtl8188eus/8188eu.ko modules/vendor/lib/modules/
          cp ../rtl8812au/88XXau.ko modules/vendor/lib/modules/
          
          cd modules/vendor/lib/modules/
          touch modules.dep modules.alias modules.softdep
          ls -1 *.ko | sed 's/\.ko$//' > modules.load || true
          cd ../../../../
          
          zip -r9 ../NetHunter-Kernel-Mi10Ultra.zip * -x .git README.md *anykernel.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "Mi10Ultra-NetHunter-${{ github.run_id }}"
          name: "Mi 10 Ultra Universal NetHunter + ReSukiSU Kernel"
          body: |
            **Automated AnyKernel3 build for Xiaomi Mi 10 Ultra (SM8250).**
            
            ### Release Highlights:
            * **Embedded Firmware Payload:** Bypasses Android's read-only `/vendor` and strict SELinux rules by hardcoding `rtl8188eufw.bin` directly into the kernel's RAM via `CONFIG_EXTRA_FIRMWARE`.
            * **Linker Collision Avoided:** External modules safely separated from native kernel space to prevent duplicate symbols.
            * **Vermagic Synchronized:** Forced `LOCALVERSION="-aptusitu-perf"`.
          draft: false
          prerelease: false
          files: NetHunter-Kernel-Mi10Ultra.zip
