name: Build Mi10Ultra NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 bison flex libssl-dev libelf-dev bc zip unzip curl wget cpio rsync build-essential device-tree-compiler

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz
          tar -xzf clang-r383902.tar.gz
          rm -f clang-r383902.tar.gz
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Clone Kernel Source
        run: |
          git clone -b android16-aptusitu https://github.com/wshamroukh/android_kernel_xiaomi_sm8250 kernel

      - name: Inline Target ReSukiSU Source Trees & Native Kbuild Bypass
        run: |
          cd kernel
          # Clean out any old driver folders to prevent conflicts
          rm -rf drivers/kernelsu KernelSU
          
          # 1. Clone the ReSukiSU repository directly into the kernel root
          # This retains the .git folder exactly where the compiler expects to see it.
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          
          # 2. THE CRITICAL FIX: Create a symlink in the drivers directory.
          # The Kbuild script uses 'test -e' to verify the path. Because this is a symlink, 
          # Kbuild correctly traverses 'drivers/kernelsu/../.git' -> 'KernelSU/.git' and passes natively!
          ln -sf ../KernelSU/kernel drivers/kernelsu
          
          # 3. Overwrite the kernel's outdated global headers with ReSukiSU's latest headers
          # This prevents the 'KSU_MAX_PACKAGE_NAME' compilation error
          mkdir -p include/uapi/linux
          cp -rf KernelSU/kernel/include/uapi/* include/uapi/ 2>/dev/null || true
          
          # 4. DYNAMIC SIGNATURE PATCHING: 
          # Inject your specific manager's (34935) hash into the driver's verification module
          SIGN_FILE="KernelSU/kernel/manager/apk_sign.c"
          if [ -f "$SIGN_FILE" ]; then
            sed -i -E 's/"[a-f0-9]{64}"/"c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6"/g' "$SIGN_FILE"
            sed -i -E 's/(EXPECTED_SIZE[^0-9]*)[0-9]+/\1 827/g' "$SIGN_FILE"
            sed -i -E 's/(EXPECTED_SIZE[^0-9a-fA-F]*)0x[0-9a-fA-F]+/\1 0x033b/g' "$SIGN_FILE"
            echo "Successfully patched ReSukiSU signature inside $SIGN_FILE"
          else
            echo "WARNING: apk_sign.c not found! Signature patch skipped."
          fi
          
          echo "ReSukiSU driver natively linked and completely ready for compilation!"

      - name: Configure Kernel Architecture & Fix Touch Drivers
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # Force remove warnings-as-errors globally
          find . -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          find . -name "Kbuild" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          
          # Fix touchscreen symbol collision to keep touch functional
          if [ -d "drivers/input/touchscreen/fts_521" ]; then
            find drivers/input/touchscreen/fts_521/ -type f -exec sed -i 's/fts_driver_init/fts_521_driver_init/g' {} +
            find drivers/input/touchscreen/fts_521/ -type f -exec sed -i 's/fts_driver_exit/fts_521_driver_exit/g' {} +
          fi
          
          # Initialize configuration files using the modern LLVM engine layout
          make O=out cas_defconfig LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-
          
          # Append driver triggers AND the core driver config parameters back into the config file
          cat <<EOF >> out/.config
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_STAGING=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_MAC80211=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211_LEDS=y
          CONFIG_RFKILL=y
          CONFIG_WIRELESS=y
          CONFIG_NL80211_TESTMODE=y
          CONFIG_MAC80211_MESH=y
          CONFIG_R8188EU=y
          CONFIG_8188EU_AP_MODE=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_G_HID=y
          CONFIG_MODULE_SIG=n
          CONFIG_MODULE_SIG_FORCE=n
          EOF
          
          # Sync and validate options
          make O=out olddefconfig LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-

      - name: Build Kernel Image and Modules
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- KCFLAGS="-Wno-error"
          echo "Build completely finished!"

      - name: Clone AnyKernel3 and Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 anykernel
          cd anykernel
          
          # Adjust general script properties inside anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/is_slot_device=auto/is_slot_device=0/g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=1/IS_SLOT_DEVICE=0/g' anykernel.sh
          
          # Force set the target block partition variables explicitly to the correct uppercase config name
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i 's/kernel.string=.*/kernel.string=NetHunter Custom Kernel for Mi10Ultra by fahmigk/g' anykernel.sh
          
          # Process and compress output boot binary components
          if [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          elif [ -f "../kernel/out/arch/arm64/boot/Image" ]; then
            gzip -9c ../kernel/out/arch/arm64/boot/Image > Image.gz
          fi
          
          cp ../kernel/out/arch/arm64/boot/dtbo.img . || true
          
          # Build package file
          zip -r9 ../NetHunter-cas-AnyKernel3.zip . -x .git README.md .gitignore
          echo "Flashable AnyKernel3 ZIP successfully constructed!"

      - name: Upload Finished Kernel Payload
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-cas-AnyKernel3
          path: NetHunter-cas-AnyKernel3.zip
