name: Build Perfect 8188eu Driver (No Flashing)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl \
            bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

      - name: Download Clang Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone the Exact Kernel Source (Searchur - aptusitu)
        run: |
          git clone --depth=1 --recurse-submodules -b android16-aptusitu https://github.com/Searchur/Xiaomi_Redmi_SM8250_SukiSU_nonGKI_kernel.git kernel-source

      - name: Configure Kernel with Live DroidSpaces/ReSukiSU Config
        run: |
          cd kernel-source
          mkdir -p out
          
          # Copy your live, extracted configuration
          cp ../stock_config out/.config

          # Disable automatic Git hash appending
          touch .scmversion
          sed -i 's/echo "\$res\$git_version"/echo "\$res"/g' scripts/setlocalversion || true
          
          # Patches for the Netprio Cgroup Bug
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' include/net/netprio_cgroup.h || true
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' net/core/netprio_cgroup.c || true

          # Force exact signature spoofing
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-cip131-st15-aptusitu-perf-gafc406285284"/g' out/.config

          # Force Wi-Fi subsystems to build natively into the core to satisfy qcacld-3.0
          cat << 'EOF' >> out/.config
          CONFIG_WIRELESS_EXT=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          EOF

      - name: Compile Core to Generate the Exact Module.symvers Map
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"

          yes "" | make O=out ARCH=arm64 CC=clang olddefconfig
          
          # We compile the Image just to force Linux to generate the Module.symvers file
          yes "" | make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 Image.gz-dtb modules

      - name: Compile the Realtek Driver Module
        run: |
          git clone -b v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eus
          cd rtl8188eus
          
          export PATH="$(pwd)/../clang/bin:$PATH"
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"
          
          # Force ARM-64 Android compilation
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_AARCH64 = n/CONFIG_PLATFORM_ARM_AARCH64 = y/g' Makefile
          sed -i 's/EXTRA_CFLAGS += -Werror/# EXTRA_CFLAGS += -Werror/g' Makefile
          
          # API Bypass for NetHunter
          sed -i 's/.*rtw_cfg80211_send_rx_assoc.*/\/\/ removed/g' os_dep/linux/ioctl_cfg80211.c
          sed -i 's/.*cfg80211_send_disassoc.*/\/\/ removed/g' os_dep/linux/ioctl_cfg80211.c

          # Compile the module AGAINST the live symvers map we just created
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- KSRC=$(pwd)/../kernel-source/out \
            CONFIG_PLATFORM_I386_PC=n CONFIG_PLATFORM_ARM_AARCH64=y \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211=1 -Wno-error -Wno-undef"

      - name: Upload Perfect Driver
        uses: actions/upload-artifact@v4
        with:
          name: TP-Link-WN722N-Driver
          path: rtl8188eus/8188eu.ko
