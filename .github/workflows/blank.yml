name: Build NetHunter Kernel (ReSukiSU - cas)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl \
            bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

      - name: Download Clang Toolchain (Proton Clang)
        run: |
          # Using Proton Clang: Highly stable and avoids broken release URLs
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel Source (aptusitu branch)
        run: |
          # This targets the exact source containing your ReSukiSU and SuSFS patches
          git clone --depth=1 -b android16-aptusitu https://github.com/Searchur/Xiaomi_Redmi_SM8250_SukiSU_nonGKI_kernel.git kernel-source

      - name: Inject NetHunter & Driver Defconfigs
        run: |
          cd kernel-source
          # Dynamically locate the device configuration file
          DEFCONFIG_PATH=$(find arch/arm64/configs -name "*cas_defconfig" | head -n 1)
          if [ -z "$DEFCONFIG_PATH" ]; then
            DEFCONFIG_PATH=$(find arch/arm64/configs -name "*sm8250-perf_defconfig" | head -n 1)
          fi

          echo "Injecting NetHunter configs into: $DEFCONFIG_PATH"

          # Append Kali NetHunter requirements
          cat << 'EOF' >> $DEFCONFIG_PATH
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_MAC80211_INJECTION=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_HID_APPLE=y
          CONFIG_HID_MAGICMOUSE=y
          CONFIG_HID_MICROSOFT=y
          CONFIG_HID_MULTITOUCH=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL818X=m
          CONFIG_RTL8187=m
          CONFIG_RTL8188EU=m
          EOF

      - name: Compile the Kernel
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"

          DEFCONFIG_NAME=$(basename $(find arch/arm64/configs -name "*cas_defconfig" | head -n 1))
          if [ -z "$DEFCONFIG_NAME" ]; then
            DEFCONFIG_NAME=$(basename $(find arch/arm64/configs -name "*sm8250-perf_defconfig" | head -n 1))
          fi

          echo "Building with defconfig: $DEFCONFIG_NAME"

          # Generate config
          make O=out ARCH=arm64 CC=clang $DEFCONFIG_NAME
          
          # Execute build
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git
          
          # Target Xiaomi Mi 10 Ultra specific block and names
          sed -i 's/kernel.string=.*/kernel.string=NetHunter-ReSukiSU-cas/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=cas/' anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot/' anykernel.sh

          # Move compiled images to the packager
          cp ../kernel-source/out/arch/arm64/boot/Image* . || true
          cp ../kernel-source/out/arch/arm64/boot/dtb* . || true

          # Create flashable zip
          zip -r9 ../NetHunter-Kernel-cas.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-ReSukiSU-cas
          path: NetHunter-Kernel-cas.zip

