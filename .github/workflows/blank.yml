name: Build NetHunter Kernel (ReSukiSU - cas)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl \
            bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

      - name: Download Clang Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel Source (aptusitu branch)
        run: |
          # Cloning WITH submodules to guarantee the native root engine is downloaded
          git clone --depth=1 --recurse-submodules -b android16-aptusitu https://github.com/Searchur/Xiaomi_Redmi_SM8250_SukiSU_nonGKI_kernel.git kernel-source

      - name: Bypass Strict Inline Hook Formatting Check
        run: |
          cd kernel-source
          echo "" > KernelSU/kernel/tools/inline_hook_check.mk || true
          echo "" > drivers/kernelsu/kernel/tools/inline_hook_check.mk || true

      - name: Inject NetHunter & INLINE Root Drivers
        run: |
          cd kernel-source
          mkdir -p out
          
          cp ../stock_config out/.config

          # --- FIX FOR CGROUP COMPILATION BUG ---
          sed -i 's/CONFIG_CGROUP_NET_PRIO=y/# CONFIG_CGROUP_NET_PRIO is not set/g' out/.config
          sed -i 's/CONFIG_CGROUP_NET_CLASSID=y/# CONFIG_CGROUP_NET_CLASSID is not set/g' out/.config
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' include/net/netprio_cgroup.h || true
          
          # Forcefully disable Manual Hook so it defaults to the native INLINE hooks
          sed -i 's/CONFIG_KSU_MANUAL_HOOK=y/# CONFIG_KSU_MANUAL_HOOK is not set/g' out/.config
          
          cat << 'EOF' >> out/.config
          # --- ReSukiSU Native INLINE Hooks ---
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KPM=y

          # --- NetHunter Core ---
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_MAC80211_INJECTION=y
          
          # --- NetHunter USB / HID ---
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_HID_APPLE=y
          CONFIG_HID_MAGICMOUSE=y
          CONFIG_HID_MICROSOFT=y
          CONFIG_HID_MULTITOUCH=y
          
          # --- NetHunter Wi-Fi Drivers ---
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH_COMMON=m
          CONFIG_ATH_CARDS=m
          CONFIG_ATH9K=m
          CONFIG_ATH9K_HTC=m
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=m
          CONFIG_RT2800USB=m
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT7601U=m
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL818X=m
          CONFIG_RTL8187=m
          CONFIG_RTL8188EU=m
          CONFIG_RTL8192CU=m
          CONFIG_RTL8XXXU=m
          EOF

      - name: Compile the Kernel
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"

          yes "" | make O=out ARCH=arm64 CC=clang olddefconfig
          
          yes "" | make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git
          
          # Update visual strings and set Mi 10 Ultra to A-only architecture
          sed -i 's/kernel.string=.*/kernel.string=NetHunter-ReSukiSU-cas/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=cas/g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0;/g' anykernel.sh
          
          # Aggressively set the block path in the main configuration file
          sed -i 's|block=auto|block=/dev/block/bootdevice/by-name/boot|g' anykernel.sh
          
          # ---> THE ULTIMATE SAFETY NET <---
          # We dive into the hidden core logic and completely replace the dummy OMAP path 
          # with your verified Infinity-X partition. If it panics, it falls back to success!
          sed -i 's|/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|/dev/block/bootdevice/by-name/boot|g' tools/ak3-core.sh

          cp ../kernel-source/out/arch/arm64/boot/Image* . || true
          cp ../kernel-source/out/arch/arm64/boot/dtb* . || true

          zip -r9 ../NetHunter-Kernel-cas.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-ReSukiSU-cas
          path: NetHunter-Kernel-cas.zip
