name: Build Mi10Ultra NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 bison flex libssl-dev libelf-dev bc zip unzip curl wget cpio rsync build-essential gcc-aarch64-linux-gnu device-tree-compiler

      - name: Clone Kernel Source
        run: |
          git clone -b android16-aptusitu https://github.com/wshamroukh/android_kernel_xiaomi_sm8250 kernel

      - name: Pull and Placement Fix for KernelSU-Next
        run: |
          cd kernel
          rm -rf drivers/kernelsu
          
          # Clone KernelSU-Next to a temporary location
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next /tmp/ksu
          
          # Safely copy into place so it satisfies drivers/Kconfig path layouts
          cp -r /tmp/ksu/kernel drivers/kernelsu
          echo "KernelSU source properly placed in drivers/kernelsu"

      - name: Patch Kernel Source (Fix GCC Hard Errors)
        run: |
          cd kernel
          # Fix bpf_trace.c inline varargs hard error for GCC cross-compilation
          sed -i 's/static inline __printf(1, 0) int bpf_do_trace_printk/static __printf(1, 0) int bpf_do_trace_printk/' kernel/trace/bpf_trace.c
          echo "Patched bpf_trace.c successfully"

      - name: Configure Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          
          make O=out cas_defconfig
          
          # Enable ReSukiSU / KernelSU
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KPROBES=y" >> out/.config
          
          # Enable NetHunter WiFi Drivers
          echo "CONFIG_RTL8188EUS=m" >> out/.config
          echo "CONFIG_RTL8812AU=m" >> out/.config
          echo "CONFIG_RTL88X2BU=m" >> out/.config
          echo "CONFIG_CFG80211=y" >> out/.config
          echo "CONFIG_MAC80211=y" >> out/.config
          echo "CONFIG_WIRELESS_EXT=y" >> out/.config
          
          make O=out olddefconfig

      - name: Build Kernel Image and Modules
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          
          # FIX: Build base 'Image' and 'dtbo.img' safely to bypass the Makefile wrapper bug
          make -j$(nproc) O=out KCFLAGS="-Wno-error" Image dtbo.img modules
          
          # Natively compress the image using safe system tools
          gzip -9 out/arch/arm64/boot/Image
          mv out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz
          
          echo "Build finished!"
          ls -lh out/arch/arm64/boot/

      - name: Clone AnyKernel3 and Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 anykernel
          cd anykernel
          
          # Configure AnyKernel3 for Mi 10 Ultra (cas) - A Only Partition
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot/block=\/dev\/block\/by-name\/boot/g' anykernel.sh
          sed -i 's/is_slot_device=auto/is_slot_device=0/g' anykernel.sh
          
          # Copy compiled kernel files
          cp ../kernel/out/arch/arm64/boot/Image.gz .
          cp ../kernel/out/arch/arm64/boot/dtbo.img .
          
          # Copy compiled WiFi modules into vendor structure
          mkdir -p modules/vendor/lib/modules
          find ../kernel/out -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \;
          
          # Create flashable ZIP
          zip -r9 ../NetHunter-cas-AnyKernel3.zip . -x .git README.md .gitignore
          echo "AnyKernel3 ZIP created!"
          ls -lh ../NetHunter-cas-AnyKernel3.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-cas-AnyKernel3
          path: NetHunter-cas-AnyKernel3.zip
