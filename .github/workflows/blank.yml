name: Build TP-Link WN722N Driver Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl \
            bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

      - name: Download Clang Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel Source (Searchur)
        run: |
          git clone --depth=1 --recurse-submodules -b android16-aptusitu https://github.com/Searchur/Xiaomi_Redmi_SM8250_SukiSU_nonGKI_kernel.git kernel-source

      - name: Configure Kernel Headers & Spoof Vermagic
        run: |
          cd kernel-source
          mkdir -p out
          
          cp ../stock_config out/.config

          # Disable automatic Git hash appending so we can manually lock the signature
          touch .scmversion
          sed -i 's/echo "\$res\$git_version"/echo "\$res"/g' scripts/setlocalversion || true
          
          # ---> THE SPOOFING FIX <---
          # Force the exact signature of your currently working ReSukiSU device
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-cip131-st15-aptusitu-perf-gafc406285284"/g' out/.config
          echo "-cip131-st15-aptusitu-perf-gafc406285284" > localversion

          # Enable core networking to satisfy the driver dependencies
          cat << 'EOF' >> out/.config
          CONFIG_WIRELESS_EXT=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          EOF

      - name: Compile Kernel Headers
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"

          yes "" | make O=out ARCH=arm64 CC=clang olddefconfig
          
          # We only need to build the core architecture to generate the linking headers for the driver
          yes "" | make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 modules_prepare

      - name: Compile External RTL8188EUS Driver Module (TP-Link WN722N V2)
        run: |
          git clone -b v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eus
          cd rtl8188eus
          
          export PATH="$(pwd)/../clang/bin:$PATH"
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"
          
          # Force Android ARM64 platform
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_AARCH64 = n/CONFIG_PLATFORM_ARM_AARCH64 = y/g' Makefile
          
          # Remove strict compiler warning traps
          sed -i 's/EXTRA_CFLAGS += -Werror/# EXTRA_CFLAGS += -Werror/g' Makefile
          
          # The API Backport Bypass (Removes the missing association functions)
          sed -i 's/.*rtw_cfg80211_send_rx_assoc.*/\/\/ removed for nethunter bypass/g' os_dep/linux/ioctl_cfg80211.c
          sed -i 's/.*cfg80211_send_disassoc.*/\/\/ removed for nethunter bypass/g' os_dep/linux/ioctl_cfg80211.c
          
          # Execute the build with the IOCTL macro injected
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- KSRC=$(pwd)/../kernel-source/out \
            CONFIG_PLATFORM_I386_PC=n CONFIG_PLATFORM_ARM_AARCH64=y \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211=1 -Wno-error -Wno-undef"

      - name: Upload Wi-Fi Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TP-Link-WN722N-Driver
          path: rtl8188eus/8188eu.ko
