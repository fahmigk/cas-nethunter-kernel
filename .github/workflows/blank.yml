name: Build NetHunter Kernel (AnyKernel3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 bison flex libssl-dev libelf-dev bc zip unzip curl wget cpio rsync build-essential gcc-aarch64-linux-gnu clang lld device-tree-compiler

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/AstideLabs/android_kernel_xiaomi_sm8250.git kernel

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Patch Kernel Source
        run: |
          cd kernel
          sed -i 's/static inline __printf(1, 0) int bpf_do_trace_printk/static __printf(1, 0) int bpf_do_trace_printk/' kernel/trace/bpf_trace.c || true
          sed -i 's/-Werror//g' Makefile || true
          sed -i 's/-Werror//g' scripts/Makefile.build || true

      - name: Clone WiFi Drivers
        run: |
          cd kernel/drivers/net/wireless/
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git || true
          git clone --depth=1 https://github.com/aircrack-ng/rtl8812au.git || true
          echo 'obj-$(CONFIG_RTL8188EUS) += rtl8188eus/' >> Makefile || true
          echo 'obj-$(CONFIG_RTL8812AU) += rtl8812au/' >> Makefile || true
          echo 'source "drivers/net/wireless/rtl8188eus/Kconfig"' >> Kconfig || true
          echo 'source "drivers/net/wireless/rtl8812au/Kconfig"' >> Kconfig || true

      - name: Configure Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out cas_defconfig || true
          make O=out vendor/cas_defconfig || true
          make O=out sm8250_defconfig || true
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_RTL8188EUS=m" >> out/.config
          echo "CONFIG_RTL8812AU=m" >> out/.config
          echo "CONFIG_RTL88X2BU=m" >> out/.config
          echo "CONFIG_MT76X2U=m" >> out/.config
          echo "CONFIG_ATH9K_HTC=m" >> out/.config
          echo "CONFIG_CFG80211=y" >> out/.config
          echo "CONFIG_MAC80211=y" >> out/.config
          echo "CONFIG_WIRELESS_EXT=y" >> out/.config
          make O=out olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -j$(nproc) O=out KCFLAGS="-Wno-error -Wno-format" Image.gz modules
          ls -lh out/arch/arm64/boot/

      - name: Package AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/ || true
          cp kernel/out/arch/arm64/boot/Image anykernel/ || true
          mkdir -p anykernel/system/lib/modules
          find kernel/out -name "*.ko" -exec cp {} anykernel/system/lib/modules/ \; || true
          cd anykernel
          sed -i 's/device.name1=.*/device.name1=cas/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=mi10ultra/' anykernel.sh
          sed -i 's/do.devicecheck=0/do.devicecheck=1/' anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot/block=\/dev\/block\/by-name\/boot/' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/' anykernel.sh
          zip -r9 ../NetHunter-cas-AnyKernel3.zip . -x .git README.md .gitignore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-cas-AnyKernel3
          path: NetHunter-cas-AnyKernel3.zip
