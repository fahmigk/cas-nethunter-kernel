name: Build Mi10Ultra NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 bison flex libssl-dev libelf-dev bc zip unzip curl wget cpio rsync build-essential device-tree-compiler

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz
          tar -xzf clang-r383902.tar.gz
          rm -f clang-r383902.tar.gz
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Clone Kernel Source
        run: |
          git clone -b android16-aptusitu https://github.com/wshamroukh/android_kernel_xiaomi_sm8250 kernel

      - name: Pull and Placement Fix for KernelSU-Next
        run: |
          cd kernel
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next /tmp/ksu
          cp -r /tmp/ksu/kernel drivers/kernelsu
          echo "KernelSU source properly placed in drivers/kernelsu"

      - name: Configure Kernel Architecture
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # Force remove warnings-as-errors globally
          find . -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          find . -name "Kbuild" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          
          # Resolve multiple definition linker collision in duplicate touchscreen modules
          sed -i '/fts_521/d' drivers/input/touchscreen/Makefile
          
          # CRITICAL FIX: Added LLVM=1 and LLVM_IAS=1 to use the integrated LLVM linker (ld.lld)
          make O=out cas_defconfig LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-
          
          # Append NetHunter WiFi and HID variables into the target configuration
          cat <<EOF >> out/.config
          CONFIG_STAGING=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_MAC80211=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211_LEDS=y
          CONFIG_RFKILL=y
          CONFIG_WIRELESS=y
          CONFIG_NL80211_TESTMODE=y
          CONFIG_MAC80211_MESH=y
          CONFIG_R8188EU=y
          CONFIG_8188EU_AP_MODE=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_G_HID=y
          EOF
          
          # Finalize configuration syncing with LLVM
          make O=out olddefconfig LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-

      - name: Build Kernel Image and Modules
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # Compile with unified LLVM components to drive a flawless compilation
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- KCFLAGS="-Wno-error"
          
          echo "Build completely finished!"
          ls -lh out/arch/arm64/boot/

      - name: Clone AnyKernel3 and Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 anykernel
          cd anykernel
          
          # Adjust settings for Mi 10 Ultra (cas) partition structure
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot/block=\/dev\/block\/by-name\/boot/g' anykernel.sh
          sed -i 's/is_slot_device=auto/is_slot_device=0/g' anykernel.sh
          
          # Package image binary objects
          if [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          elif [ -f "../kernel/out/arch/arm64/boot/Image" ]; then
            gzip -9c ../kernel/out/arch/arm64/boot/Image > Image.gz
          fi
          
          cp ../kernel/out/arch/arm64/boot/dtbo.img . || true
          
          # Collect wireless modules (.ko)
          mkdir -p modules/vendor/lib/modules
          find ../kernel/out -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \;
          
          # Archive into clean flashable payload structure
          zip -r9 ../NetHunter-cas-AnyKernel3.zip . -x .git README.md .gitignore
          echo "Flashable AnyKernel3 ZIP complete!"

      - name: Upload Finished Kernel Payload
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-cas-AnyKernel3
          path: NetHunter-cas-AnyKernel3.zip
