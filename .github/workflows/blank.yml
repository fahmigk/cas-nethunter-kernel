name: Build Mi10Ultra Kernel with RTL8188EUS

on:
  workflow_dispatch:

env:
  KERNEL_VERSION: "4.19.325-cip131-st15-aptusitu-perf-gafc406285284"
  KERNEL_COMMIT: "afc406285284"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 bison flex libssl-dev libelf-dev bc zip unzip curl wget cpio rsync build-essential gcc-aarch64-linux-gnu clang lld device-tree-compiler

      - name: Extract boot.zip
        run: |
          unzip -q boot.zip -d boot_extracted
          echo "Extracted boot.zip:"
          ls -lh boot_extracted/

      - name: Clone Kernel Source
        run: |
          git clone -b android16-aptusitu https://github.com/ApartTUSITU/kernel_xiaomi_sm8250_mod.git kernel
          cd kernel
          if git rev-parse --verify --quiet afc406285284^{commit}; then
            git checkout afc406285284
            echo "Checked out exact commit afc406285284"
          else
            echo "Commit not found, using latest from android16-aptusitu branch"
          fi
          grep "VERSION\|PATCHLEVEL\|SUBLEVEL\|EXTRAVERSION" Makefile | head -4

      - name: Configure Kernel
        run: |
          cd kernel
          if grep -q "CONFIG_KSU=y" arch/arm64/configs/cas_defconfig; then
            echo "ReSukisu already enabled"
          else
            echo "CONFIG_KSU=y" >> arch/arm64/configs/cas_defconfig
            echo "Added CONFIG_KSU=y"
          fi
          echo "" >> arch/arm64/configs/cas_defconfig
          echo "# NetHunter RTL8188EUS" >> arch/arm64/configs/cas_defconfig          echo "CONFIG_RTL8188EUS=y" >> arch/arm64/configs/cas_defconfig
          echo "CONFIG_USB=y" >> arch/arm64/configs/cas_defconfig
          echo "CONFIG_USB_SUPPORT=y" >> arch/arm64/configs/cas_defconfig
          echo "CONFIG_CFG80211=y" >> arch/arm64/configs/cas_defconfig
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/cas_defconfig
          echo "CONFIG_WIRELESS_EXT=y" >> arch/arm64/configs/cas_defconfig
          echo "CONFIG_NETDEVICES=y" >> arch/arm64/configs/cas_defconfig
          echo "CONFIG_WLAN=y" >> arch/arm64/configs/cas_defconfig
          echo "Defconfig updated"

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          export LOCALVERSION="-aptusitu-perf"
          make O=out clean
          make O=out cas_defconfig
          echo "=== Config Summary ==="
          grep -E "CONFIG_KSU|CONFIG_RTL8188EUS|CONFIG_CFG80211" out/.config || true
          make -j$(nproc) O=out KCFLAGS="-Wno-error"
          echo "Kernel build complete"
          ls -lh out/arch/arm64/boot/

      - name: Extract MagiskBoot from Official APK
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.apk
          unzip -q magisk.apk -d magisk_extracted
          cp magisk_extracted/lib/x86_64/libmagiskboot.so magiskboot-linux
          chmod +x magiskboot-linux
          ./magiskboot-linux --version || echo "magiskboot ready"

      - name: Repack boot.img
        run: |
          mkdir -p out/boot
          cp boot_extracted/boot.img out/boot/original-boot.img
          cd out/boot
          ../../magiskboot-linux unpack original-boot.img
          
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            KERNEL_IMG=../kernel/out/arch/arm64/boot/Image.gz
          elif [ -f ../kernel/out/arch/arm64/boot/Image ]; then
            KERNEL_IMG=../kernel/out/arch/arm64/boot/Image
          else
            echo "Kernel image not found!"
            exit 1
          fi

          if [ -f split_img/zImage ]; then            cp $KERNEL_IMG split_img/zImage
            echo "Replaced zImage"
          elif [ -f split_img/Image ]; then
            cp $KERNEL_IMG split_img/Image
            echo "Replaced Image"
          else
            cp $KERNEL_IMG split_img/
            echo "Added kernel image to split_img"
          fi
          ../../magiskboot-linux repack original-boot.img new-boot.img
          echo "Repacked boot.img:"
          ls -lh new-boot.img

      - name: Create Flashable ZIP
        run: |
          mkdir -p flashable/META-INF/com/google/android
          mkdir -p flashable/system/lib/modules/4.19.325-cip131-st15-aptusitu-perf-gafc406285284
          cp out/boot/new-boot.img flashable/boot.img
          printf '#!/sbin/sh\nui_print "Installing NetHunter Kernel..."\nui_print "Kernel: 4.19.325 with RTL8188EUS"\nui_print "ReSukiSU: Preserved"\nBLOCK=/dev/block/bootdevice/by-name/boot\ndd if=$TMPDIR/boot.img of=$BLOCK\nui_print "Installation complete!"\nui_print "Reboot now!"\n' > flashable/META-INF/com/google/android/update-binary
          chmod +x flashable/META-INF/com/google/android/update-binary
          echo '#MAGISK' > flashable/META-INF/com/google/android/updater-script
          cd flashable
          zip -r9 ../NetHunter-Kernel-Mi10Ultra-A16.zip .
          echo "Created flashable ZIP:"
          ls -lh ../NetHunter-Kernel-Mi10Ultra-A16.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Boot-Image
          path: |
            out/boot/new-boot.img
            NetHunter-Kernel-Mi10Ultra-A16.zip
