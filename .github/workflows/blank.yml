name: Build Mi10 Ultra NetHunter & ReSukiSU Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl \
            bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

      - name: Download Clang Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone the Kernel Source
        run: |
          git clone --depth=1 --recurse-submodules -b android16-aptusitu https://github.com/Searchur/Xiaomi_Redmi_SM8250_SukiSU_nonGKI_kernel.git kernel-source

      - name: Configure and Patch Kernel
        run: |
          cd kernel-source
          mkdir -p out
          
          # Copy base configuration
          cp ../stock_config out/.config
          
          touch .scmversion
          sed -i 's/echo "\$res\$git_version"/echo "\$res"/g' scripts/setlocalversion || true
          
          # Fix Netprio Cgroup Bug
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' include/net/netprio_cgroup.h || true
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' net/core/netprio_cgroup.c || true
          
          # Disable strict compiler Werrors
          find . -type f -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          find . -type f -name "Kbuild" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          
          # FUSE the Wi-Fi Core
          ./scripts/config --file out/.config -e CONFIG_MODULES
          ./scripts/config --file out/.config -e CONFIG_WIRELESS
          ./scripts/config --file out/.config -e CONFIG_WIRELESS_EXT
          ./scripts/config --file out/.config -e CONFIG_CFG80211
          ./scripts/config --file out/.config -e CONFIG_MAC80211
          
          # Force Enable Core Dependencies for ReSukiSU
          ./scripts/config --file out/.config -e CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config -e CONFIG_DEBUG_FS
          ./scripts/config --file out/.config -e CONFIG_SECURITY
          
          # Force Enable ReSukiSU Root Hooks & Non-GKI Flags
          ./scripts/config --file out/.config -e CONFIG_KPROBES
          ./scripts/config --file out/.config -e CONFIG_HAVE_KPROBES
          ./scripts/config --file out/.config -e CONFIG_KPROBE_EVENTS
          ./scripts/config --file out/.config -e CONFIG_KPM
          ./scripts/config --file out/.config -e CONFIG_KALLSYMS
          ./scripts/config --file out/.config -e CONFIG_KALLSYMS_ALL
          ./scripts/config --file out/.config -e CONFIG_KSU
          
          # Force Enable SUSFS
          ./scripts/config --file out/.config -e CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config -e CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config -e CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config -e CONFIG_KSU_SUSFS_SUS_KSTAT

      - name: Compile the Full Kernel
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          
          # Full Professional LLVM Definition
          MAKE_ARGS="O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip WERROR=0 KCFLAGS=-Wno-unknown-warning-option KSU=true KSU_SUSFS=true"
          
          yes "" | make $MAKE_ARGS olddefconfig
          
          # Verify KSU was retained
          grep "CONFIG_KSU" out/.config || echo "WARNING: KSU missing!"
          
          # Build Kernel & Modules
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb modules
          
          # Map native modules safely
          make $MAKE_ARGS modules_install INSTALL_MOD_PATH=modules_install

      - name: Compile External NetHunter Driver (RTL8188EUS)
        run: |
          git clone -b v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eus
          cd rtl8188eus
          export PATH="$(pwd)/../clang/bin:$PATH"
          
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_AARCH64 = n/CONFIG_PLATFORM_ARM_AARCH64 = y/g' Makefile
          
          # Unified LLVM toolchain for external driver to prevent signature mismatch
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KSRC=$(pwd)/../kernel-source/out \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211=1 -Wno-error -Wno-undef" \
            modules
          llvm-strip --strip-unneeded -g 8188eu.ko

      - name: Compile External NetHunter Driver (RTL8812AU)
        run: |
          git clone -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au.git rtl8812au
          cd rtl8812au
          export PATH="$(pwd)/../clang/bin:$PATH"
          
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_AARCH64 = n/CONFIG_PLATFORM_ARM_AARCH64 = y/g' Makefile
          
          # Unified LLVM toolchain for external driver
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KSRC=$(pwd)/../kernel-source/out \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211=1 -Wno-error -Wno-undef" \
            modules
          llvm-strip --strip-unneeded -g 88XXau.ko

      - name: Package Universal AOSP Flasheable ZIP (AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          
          # Write exact Mi 10 Ultra specific AnyKernel.sh
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Ramdisk Mod Script for Mi 10 Ultra
          properties() { '
          kernel.string=Mi 10 Ultra NetHunter + ReSukiSU Kernel
          do.devicecheck=0
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cas
          device.name2=
          device.name3=
          '; }
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          . tools/ak3-core.sh;
          
          dump_boot;
          write_boot;
          EOF
          
          # Copy Kernel Image
          cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb ./
          
          # Create universal vendor module directory
          mkdir -p modules/vendor/lib/modules/
          
          # Safely extract all natively compiled .ko modules without breaking paths
          find ../kernel-source/out/modules_install/ -type f -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \;
          
          # Add external NetHunter Wi-Fi drivers
          cp ../rtl8188eus/8188eu.ko modules/vendor/lib/modules/
          cp ../rtl8812au/88XXau.ko modules/vendor/lib/modules/
          
          # Strip debug info uniformly
          export PATH="$(pwd)/../clang/bin:$PATH"
          find modules/vendor/lib/modules/ -name "*.ko" -exec llvm-strip --strip-unneeded -g {} \;
          
          # Create clean modules.load list dynamically for flawless AOSP auto-load
          cd modules/vendor/lib/modules/
          touch modules.dep modules.alias modules.softdep
          ls -1 *.ko | sed 's/\.ko$//' > modules.load
          cd ../../../../
          
          zip -r9 ../NetHunter-Kernel-Mi10Ultra.zip * -x .git README.md *anykernel.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "Mi10Ultra-NetHunter-${{ github.run_id }}"
          name: "Mi 10 Ultra Universal NetHunter + ReSukiSU Kernel"
          body: |
            **Automated AnyKernel3 build for Xiaomi Mi 10 Ultra (SM8250).**
            
            ### Release Highlights:
            * **ReSukiSU Integrated:** Kernel-level root and SUSFS are hardcoded via Native LLVM toolchain passing.
            * **Universal Native Modules:** Utilizes `modules_install` for native dependency mapping, resolving bootloops across custom ROMs.
            * **FUSED Wi-Fi Core (`cfg80211`):** Resolves all native driver linker conflicts permanently.
            * **Plug & Play NetHunter Adapters:** Includes both **RTL8188EUS** (`8188eu.ko`) and **RTL8812AU** (`88XXau.ko`), compiled safely with the identical LLVM toolchain.
          draft: false
          prerelease: false
          files: NetHunter-Kernel-Mi10Ultra.zip
